<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100b12">

    <title>Our Memory Box ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg: #100b12;
            --card: #1d141e;
            --rose: #e8a7b7;
            --text: #fff4f6;
            --muted: #c4aeb8;
            --border: rgba(232, 167, 183, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 35px 6%;
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            background:
                radial-gradient(circle at 10% 5%, rgba(111, 46, 76, 0.25), transparent 30%),
                radial-gradient(circle at 90% 25%, rgba(80, 40, 80, 0.2), transparent 30%),
                var(--bg);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 55px;
        }

        .logo {
            color: var(--text);
            text-decoration: none;
            font-family: "Playfair Display", serif;
            font-size: 1.3rem;
        }

        .logo span {
            color: var(--rose);
        }

        .back-link {
            color: var(--rose);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 10px 17px;
            transition: 0.25s;
        }

        .back-link:hover {
            background: var(--rose);
            color: var(--bg);
        }

        .heading {
            max-width: 700px;
            margin: 0 auto 35px;
            text-align: center;
        }

        .eyebrow {
            color: var(--rose);
            letter-spacing: 3px;
            font-size: 0.75rem;
            margin-bottom: 14px;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(2.3rem, 6vw, 4rem);
            font-weight: 500;
            margin-bottom: 14px;
        }

        h1 em {
            color: var(--rose);
        }

        .heading p {
            color: var(--muted);
            line-height: 1.7;
        }

        .photo-count {
            color: var(--rose);
            text-align: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            max-width: 1250px;
            margin: 0 auto;
        }

        .photo-card {
            position: relative;
            overflow: hidden;
            min-height: 210px;
            aspect-ratio: 4 / 5;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.45s ease;
        }

        .photo-card:hover img {
            transform: scale(1.06);
        }

        .photo-number {
            position: absolute;
            left: 12px;
            bottom: 12px;
            padding: 7px 11px;
            color: white;
            background: rgba(16, 11, 18, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: rgba(5, 3, 7, 0.94);
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: min(900px, 90vw);
            max-height: 82vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 15px 60px rgba(0, 0, 0, 0.5);
        }

        .lightbox button {
            position: absolute;
            border: 1px solid var(--border);
            color: white;
            background: rgba(35, 20, 32, 0.9);
            cursor: pointer;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.4rem;
        }

        .close-lightbox {
            top: 20px;
            right: 20px;
        }

        .prev-photo {
            left: 20px;
        }

        .next-photo {
            right: 20px;
        }

        .footer {
            text-align: center;
            color: var(--muted);
            margin-top: 55px;
            font-size: 0.9rem;
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 22px 5%;
            }

            .top-bar {
                margin-bottom: 40px;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .photo-card {
                min-height: 160px;
                border-radius: 13px;
            }

            .lightbox {
                padding: 12px;
            }

            .prev-photo {
                left: 8px;
            }

            .next-photo {
                right: 8px;
            }
        }
    </style>
</head>

<body>

    <header class="top-bar">
        <a href="index.html" class="logo">Dear <span>Bestu ♡</span></a>
        <a href="index.html#memories" class="back-link">← Back to website</a>
    </header>

    <main>
        <section class="heading">
            <p class="eyebrow">LITTLE MOMENTS, BIG FEELINGS</p>
            <h1>Our Memory <em>Box.</em></h1>
            <p>
                Every picture holds a little piece of our story.
                Tap any photo to see it bigger. ♡
            </p>
        </section>

        <p class="photo-count">18 memories · one special person ♡</p>

        <section class="gallery" id="gallery" aria-label="Photo memories"></section>
    </main>

    <div class="lightbox" id="lightbox" aria-label="Expanded photo">
        <button class="close-lightbox" id="close-lightbox" aria-label="Close photo">×</button>
        <button class="prev-photo" id="prev-photo" aria-label="Previous photo">‹</button>
        <img id="lightbox-image" src="" alt="Memory enlarged">
        <button class="next-photo" id="next-photo" aria-label="Next photo">›</button>
    </div>

    <footer class="footer">
        Made with love, just for you. ♡
    </footer>

    <script>
        const gallery = document.getElementById("gallery");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightbox-image");

        const photos = [
    "benim.jpg",
    "bestu1.jpeg",
    "bestu4.jpg",
    "bestu3.jpg",
    "bestu2.jpg",
    "bestu5.jpeg",
    "bestu6.jpg",
    "bestu7.jpg",
    "bestu8.jpg",
    "bestu9.jpg",
    "bestu10.jpg",
    "bestu11.jpeg",
    "bestu12.jpg",
    "bestu13.jpg",
    "bestu14.jpg",
    "bestu15.jpg",
    "bestu16.jpg",
   "bestu17.jpeg",
];
        

        let currentPhoto = 0;

        photos.forEach((photo, index) => {
            const card = document.createElement("button");
            card.className = "photo-card";
            card.type = "button";
            card.setAttribute("aria-label", `Open memory ${index + 1}`);

            const image = document.createElement("img");
            image.src = photo;
            image.alt = `Memory ${index + 1}`;
            image.loading = "lazy";

            image.onerror = () => {
                image.style.display = "none";
                card.style.cursor = "default";
                card.innerHTML = `
                    <span style="display:block;padding:20px;color:#e8a7b7">
                        Photo ${index + 1}<br>
                        <small>Check filename in images folder</small>
                    </span>
                `;
            };

            const number = document.createElement("span");
            number.className = "photo-number";
            number.textContent = `Memory ${index + 1}`;

            card.appendChild(image);
            card.appendChild(number);

            card.addEventListener("click", () => {
                if (image.complete && image.naturalWidth > 0) {
                    currentPhoto = index;
                    showPhoto(currentPhoto);
                }
            });

            gallery.appendChild(card);
        });

        function showPhoto(index) {
            currentPhoto = (index + photos.length) % photos.length;
            lightboxImage.src = photos[currentPhoto];
            lightbox.classList.add("open");
        }

        function closePhoto() {
            lightbox.classList.remove("open");
            lightboxImage.src = "";
        }

        document.getElementById("close-lightbox").addEventListener("click", closePhoto);
        document.getElementById("prev-photo").addEventListener("click", () => {
            showPhoto(currentPhoto - 1);
        });
        document.getElementById("next-photo").addEventListener("click", () => {
            showPhoto(currentPhoto + 1);
        });

        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
                closePhoto();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (!lightbox.classList.contains("open")) return;

            if (event.key === "Escape") closePhoto();
            if (event.key === "ArrowLeft") showPhoto(currentPhoto - 1);
            if (event.key === "ArrowRight") showPhoto(currentPhoto + 1);
        });
    </script>

</body>
</html>
